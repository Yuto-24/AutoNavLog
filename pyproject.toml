[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonavlog"
version = "0.2.0"
description = "Ground-planning support for Civil Aviation College NAV2 navigation logs"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "LicenseRef-Proprietary"
authors = [{name = "AutoNavLog contributors"}]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "folium>=0.17,<1",
  "geographiclib>=2,<3",
  "ipywidgets>=8.1,<9",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
msm = ["jma-msm-wind==0.2.1"]
test = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonavlog = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["autonavlog"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "defusedxml.*",
  "geographiclib.*",
  "IPython.*",
  "ipywidgets.*",
  "msm_wind.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
