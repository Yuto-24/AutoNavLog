[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonavlog"
dynamic = ["version"]
description = "Ground-planning support for Civil Aviation College NAV2 navigation logs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
authors = [{name = "AutoNavLog contributors"}]
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "geographiclib>=2,<3",
  "pydantic>=2.8,<3",
  "PyJWT[crypto]>=2.13.0,<3",
  "uvicorn>=0.35,<1",
]

[project.scripts]
autonavlog-web = "autonavlog.web.__main__:main"

[project.optional-dependencies]
msm = ["jma-msm-wind==0.2.1"]
test = [
  "anyio>=4,<5",
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonavlog = [
  "py.typed",
  "web/static/*",
  "web/static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep Pydantic generics on typing.Generic until their PEP 695 migration is validated separately.
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
packages = ["autonavlog"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "defusedxml.*",
  "geographiclib.*",
  "msm_wind.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
