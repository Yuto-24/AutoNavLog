name: release-to-drive

on:
  workflow_dispatch:
    inputs:
      msm_valid_time_utc:
        description: "実MSM受入時刻 (YYYY-MM-DDTHH:MM:SSZ、再実行時も同じ値を使用)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Do not replace this with the current clock. A future scheduled trigger must
      # provide a reproducible, version-controlled UTC value or fail closed.
      MSM_VALID_TIME_UTC: ${{ inputs.msm_valid_time_utc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate reproducible MSM valid time
        run: |
          if [[ ! "$MSM_VALID_TIME_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "msm_valid_time_utc must use YYYY-MM-DDTHH:MM:SSZ" >&2
            exit 2
          fi
          python -c 'import datetime, os; datetime.datetime.strptime(os.environ["MSM_VALID_TIME_UTC"], "%Y-%m-%dT%H:%M:%SZ")'
      - name: Checkout pinned MSM source
        uses: actions/checkout@v4
        with:
          repository: Yuto-24/jma-msm-wind-kyushu
          ref: 52adad68fd39d377c77774265229ea3b320c2c92
          token: ${{ secrets.MSM_REPO_TOKEN }}
          path: vendor/jma-msm-wind
      - name: Install build and Drive tooling
        run: python -m pip install build google-api-python-client google-auth
      - name: Build Web assets for the AutoNavLog wheel
        run: |
          npm --prefix web ci
          npm --prefix web run build
          mkdir -p src/autonavlog/web/static
          cp -R web/dist/. src/autonavlog/web/static/
      - name: Build pinned wheels
        run: |
          mkdir -p release/wheels
          python -m build --wheel --outdir release/wheels
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/release/wheels" vendor/jma-msm-wind
      - name: Assemble runtime data
        run: |
          cp -R data release/data/autonavlog
      - name: Install release wheels in isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/release-validation-venv"
          "$RUNNER_TEMP/release-validation-venv/bin/python" -m pip install \
            release/wheels/jma_msm_wind-0.2.1-py3-none-any.whl \
            release/wheels/autonavlog-1.4.2-py3-none-any.whl
          "$RUNNER_TEMP/release-validation-venv/bin/python" -c \
            'from pathlib import Path; import autonavlog.web; static = Path(autonavlog.web.__file__).with_name("static"); assert (static / "index.html").is_file()'
      - name: Validate release runtime data
        id: runtime_data_validation
        continue-on-error: true
        env:
          PYTHONNOUSERSITE: "1"
        run: >-
          "$RUNNER_TEMP/release-validation-venv/bin/python"
          scripts/validate_runtime_data.py
          release/data/autonavlog
          --output release/acceptance/runtime-data-acceptance.json
      - name: Validate live real MSM
        id: real_msm_validation
        continue-on-error: true
        env:
          PYTHONNOUSERSITE: "1"
        run: >-
          "$RUNNER_TEMP/release-validation-venv/bin/python"
          scripts/validate_real_msm_release.py
          --cache-dir "$RUNNER_TEMP/real-msm-cache"
          --live
          --valid-time "$MSM_VALID_TIME_UTC"
          --output release/acceptance/real-msm-acceptance.json
      - name: Preserve release validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/acceptance/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce release validation
        if: always()
        env:
          RUNTIME_DATA_OUTCOME: ${{ steps.runtime_data_validation.outcome }}
          REAL_MSM_OUTCOME: ${{ steps.real_msm_validation.outcome }}
        run: |
          if [[ "$RUNTIME_DATA_OUTCOME" != "success" || "$REAL_MSM_OUTCOME" != "success" ]]; then
            echo "release validation failed: runtime_data=$RUNTIME_DATA_OUTCOME real_msm=$REAL_MSM_OUTCOME" >&2
            exit 1
          fi
      - name: Build release manifest
        run: python scripts/build_release_manifest.py release --version 1.4.2
      - name: Upload versioned release to Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: >-
          python scripts/drive_release.py upload release
          --parent-id "${{ secrets.GDRIVE_RELEASE_FOLDER_ID }}"
          --folder-name "1.4.2"
