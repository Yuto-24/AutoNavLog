name: publish-github-release

on:
  push:
    branches: [main, release/1.x]
    paths: [VERSION]

permissions:
  contents: write

# Serialize publication across both version lines without cancelling a release.
concurrency:
  group: publish-github-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the matching version line
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_github_release.py
