name: test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: mypy src/autonavlog
      - run: pytest --cov=autonavlog --cov-report=term-missing
      - run: python scripts/validate_performance_data.py data/performance
      - run: python scripts/validate_notebook.py notebooks/AutoNavLog.ipynb
      - run: python scripts/export_schemas.py --check
      - run: python -m build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  release_prepare:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - run: python scripts/prepare_v1_2_0_release.py
      - name: Commit prepared metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md web/package-lock.json
          if git diff --cached --quiet; then
            echo "Release metadata is already prepared."
            exit 0
          fi
          git commit -m "chore: prepare v1.2.0 release metadata"
          git push origin HEAD:${{ github.head_ref }}
