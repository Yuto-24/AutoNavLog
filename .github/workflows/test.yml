name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: docker build --target release-tools --tag autonavlog:release-tools .
      - name: Validate release sources and PR contract
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BASE" ]; then
            printf "%s" "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            docker run --rm -v "$PWD:/work:ro" -v "$RUNNER_TEMP:/runner-temp:ro" -w /work autonavlog:release-tools python scripts/validate_release.py --base "$PR_BASE" --pr-body-file /runner-temp/pr-body.md
          else
            docker run --rm -v "$PWD:/work:ro" -w /work autonavlog:release-tools python scripts/validate_release.py
          fi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --target test --tag autonavlog:test .
      - run: docker run --rm autonavlog:test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --target runtime --tag autonavlog:runtime .
      - name: Read expected version from the production image source
        run: |
          expected_version="$(docker run --rm --entrypoint python autonavlog:runtime -c 'from pathlib import Path; print(Path("VERSION").read_text(encoding="utf-8").strip())')"
          test -n "$expected_version"
          echo "EXPECTED_VERSION=$expected_version" >> "$GITHUB_ENV"
      - name: Verify production image purity
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' autonavlog:runtime)" = "autonavlog"
          docker run --rm --entrypoint sh autonavlog:runtime -c '
            set -eu
            test "$(id -u)" = "10001"
            test ! -d /opt/autonavlog/tests
            test ! -d /opt/autonavlog/scripts
            test ! -d /opt/autonavlog/.github
            test ! -d /opt/autonavlog/web
            test ! -d /opt/autonavlog/build
            test ! -d /opt/autonavlog/dist
            test ! -d /opt/autonavlog/.pytest_cache
            test ! -d /opt/autonavlog/.mypy_cache
            test ! -d /opt/autonavlog/.ruff_cache
            test ! -d /opt/autonavlog/src/autonavlog.egg-info
            python -c "import sys; assert sys.version_info[:2] == (3, 12)"
            python -c "import importlib.util; assert all(importlib.util.find_spec(module) is None for module in (\"pytest\", \"ruff\", \"mypy\", \"build\"))"
            expected_version="$(python -c '\''from pathlib import Path; print(Path("VERSION").read_text(encoding="utf-8").strip())'\'')"
            installed_version="$(python -c '\''from importlib.metadata import version; print(version("autonavlog"))'\'')"
            test "$installed_version" = "$expected_version"
          '
      - name: Start production image with its default command
        run: docker run --detach --name autonavlog-runtime-smoke --publish 127.0.0.1::8000 autonavlog:runtime
      - name: Check production health within two minutes
        run: |
          port="$(docker port autonavlog-runtime-smoke 8000/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          test -n "$port"
          response="$(timeout 120s sh -c '
            set -eu
            until response="$(curl --fail --silent --show-error "$1" 2>/dev/null)"; do sleep 2; done
            printf "%s" "$response"
          ' sh "http://127.0.0.1:$port/healthz")"
          docker exec --env HEALTH_RESPONSE="$response" --env EXPECTED_VERSION="$EXPECTED_VERSION" autonavlog-runtime-smoke python -c 'import json, os; health = json.loads(os.environ["HEALTH_RESPONSE"]); assert health == {"status": "ok", "version": os.environ["EXPECTED_VERSION"]}'
      - name: Show runtime logs after failure
        if: failure()
        run: docker logs autonavlog-runtime-smoke
      - name: Remove runtime smoke container and its anonymous volume
        if: always()
        run: docker rm --force --volumes autonavlog-runtime-smoke || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run test:application
      - run: npm --prefix web run test:release-notes
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  taf-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/taf-proxy/package-lock.json
      - run: npm --prefix services/taf-proxy ci
      - run: npm --prefix services/taf-proxy test
      - run: npm --prefix services/taf-proxy run check

  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install "setuptools>=69" wheel vendor/jma_msm_wind-0.2.1-py3-none-any.whl ".[test]"
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: npm --prefix web run build:local
      - run: npm --prefix web run test:auth
      - name: Verify Local persistence and session/calculation regression without FastAPI
        env:
          AUTONAVLOG_REFERENCE_PYTHON: python3
        run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory web/dist-local > /tmp/local-server.log 2>&1 &
          local_server_pid=$!
          trap 'kill "$local_server_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/ > /dev/null
          npm --prefix web run test:local
          VITE_TAF_PROXY_URL=https://taf.example/taf npm --prefix web run build:local
          npm --prefix web run test:taf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-failure
          path: |
            /tmp/autonavlog-issue117-playwright
            /tmp/autonavlog-taf-playwright
            /tmp/local-server.log
            /tmp/autonavlog-auth-tests
