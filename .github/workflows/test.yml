name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: mypy src/autonavlog
      - run: pytest --cov=autonavlog --cov-report=term-missing
      - run: python scripts/validate_performance_data.py data/performance
      - run: python scripts/validate_notebook.py notebooks/AutoNavLog.ipynb
      - run: python scripts/export_schemas.py --check
      - run: python -m build
