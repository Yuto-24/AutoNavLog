name: test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: mypy src/autonavlog
      - run: pytest --cov=autonavlog --cov-report=term-missing
      - run: python scripts/validate_performance_data.py data/performance
      - run: python scripts/validate_notebook.py notebooks/AutoNavLog.ipynb
      - run: python scripts/export_schemas.py --check
      - run: python -m build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  apply_display_total_fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 65
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - run: python scripts/apply_display_total_fix.py
      - name: Commit display total fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/autonavlog/application/navlog_display.py \
            tests/integration/test_issue_43_golden.py \
            docs/calculation_rules.md
          git commit -m "fix: keep NAV LOG display totals arithmetically consistent"
          git push origin HEAD:${{ github.head_ref }}
