name: Release v1.2.0 helper

on:
  push:
    branches:
      - release-v1.2.0-helper

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare v1.2.0 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          version = "1.2.0"
          previous = "1.1.0"

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old = f'version = "{previous}"'
          new = f'version = "{version}"'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected pyproject version occurrences: {text.count(old)}")
          pyproject.write_text(text.replace(old, new), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = f"- 現在のバージョン: `{previous}`"
          new = f"- 現在のバージョン: `{version}`"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected README version occurrences: {text.count(old)}")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          package = Path("web/package.json")
          payload = json.loads(package.read_text(encoding="utf-8"))
          if payload.get("version") != previous:
              raise SystemExit(f"unexpected web/package.json version: {payload.get('version')}")
          payload["version"] = version
          package.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          lock = Path("web/package-lock.json")
          payload = json.loads(lock.read_text(encoding="utf-8"))
          if payload.get("version") != previous or payload.get("packages", {}).get("", {}).get("version") != previous:
              raise SystemExit("unexpected web/package-lock.json root version")
          payload["version"] = version
          payload["packages"][""]["version"] = version
          lock.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          workflow = Path(".github/workflows/release-to-drive.yml")
          text = workflow.read_text(encoding="utf-8")
          replacements = {
              f"release/wheels/autonavlog-{previous}-py3-none-any.whl": f"release/wheels/autonavlog-{version}-py3-none-any.whl",
              f"--version {previous}": f"--version {version}",
              f'--folder-name "{previous}"': f'--folder-name "{version}"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected release workflow occurrence for {old!r}: {text.count(old)}")
              text = text.replace(old, new)
          workflow.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "## Unreleased\n"
          if text.count(anchor) != 1:
              raise SystemExit("CHANGELOG Unreleased anchor is not unique")
          entry = """## Unreleased

## 1.2.0 - 2026-08-17

### 追加

- KML候補の始点・終点から5 NM以内の空港をFROM/TOとして自動決定し、Webでは読取専用で表示するようにしました。
- RUN UPの有無とA/C ON/OFFを計画入力へ追加しました。RUN UPありは10分・1.5 galとして燃料計画へ反映します。
- FUEL表へBOF Fuelを追加しました。BOFは `CLIMB + CRUISE + DESCENT + TGL + ADDITIONAL` で、RUN UPとRESERVEは含みません。

### 変更

- QNHの入力・取得・推定・表示・帳票出力を廃止し、標準気象モードをMSMへ統一しました。
- POH巡航表から自動採用したKTASへ、ノーズフェアリングなしの `-10 KTAS` と、A/C ON時の追加 `-2 KTAS` を適用するようにしました。手入力TAS/GPHには補正を重ねません。
- 風向入力を001〜360の整数に統一し、内部では北を0°へ正規化しつつ画面・帳票では360として表示します。
- 経路表のROLE列を削除しました。内部roleと地図上の表現は維持しています。
- 1,240 px以下の画面を「入力 → 経路・MAP → 準備状況 → NAV LOG → ガイダンス」の縦順へ統一しました。

### 互換性

- Project schemaをv2へ更新しました。旧Project/SnapshotのQNH fieldは読込時に破棄し、RUN UP・A/Cは既定ONとして移行します。
- 旧データの風向0°は北360°として読み込み、再保存時は新しい入力契約へ揃えます。

"""
          changelog.write_text(text.replace(anchor, entry, 1), encoding="utf-8")
          PY

      - name: Commit release metadata to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml README.md CHANGELOG.md web/package.json web/package-lock.json .github/workflows/release-to-drive.yml
          git commit -m "chore: prepare v1.2.0 release"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create GitHub Release v1.2.0
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          AutoNavLog 1.2.0

          - KML端点からFROM/TOを5 NM以内で自動決定し、読取専用表示へ変更。
          - QNHの入力・取得・推定・表示を廃止し、気象モードをMSMへ統一。
          - RUN UP / A/C設定、BOF Fuelを追加。
          - 自動巡航KTASへノーズフェアリング `-10 KTAS`、A/C ON時 `-2 KTAS` の補正を追加。
          - 風向入力を001〜360の整数へ統一し、北を360表示。
          - 経路表のROLE列を削除し、1,240 px以下の縦方向ワークフローを改善。
          - 旧Project/Snapshotはschema v2へ自動移行。
          - Playwright E2E: 20/20 passを確認済み。
          EOF

          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "v1.2.0 already exists" >&2
            exit 1
          fi
          gh release create v1.2.0 \
            --target "$RELEASE_SHA" \
            --title "AutoNavLog 1.2.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove helper branch
        if: success()
        shell: bash
        run: git push origin --delete release-v1.2.0-helper
