name: autonavlog

services:
  autonavlog:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: autonavlog:local
    restart: unless-stopped
    init: true
    ports:
      - "${AUTONAVLOG_BIND_ADDRESS:-0.0.0.0}:${AUTONAVLOG_HOST_PORT:-8123}:8000"
    environment:
      AUTONAVLOG_TRUSTED_LOCAL_IDENTITY: "${AUTONAVLOG_TRUSTED_LOCAL_IDENTITY:-}"
      AUTONAVLOG_SESSION_COOKIE_SECURE: "${AUTONAVLOG_SESSION_COOKIE_SECURE:-true}"
      AUTONAVLOG_CLOUDFLARE_TEAM_DOMAIN: "${AUTONAVLOG_CLOUDFLARE_TEAM_DOMAIN:-}"
      AUTONAVLOG_CLOUDFLARE_ACCESS_AUDIENCE: "${AUTONAVLOG_CLOUDFLARE_ACCESS_AUDIENCE:-}"
      AUTONAVLOG_FIREBASE_PROJECT_ID: "${AUTONAVLOG_FIREBASE_PROJECT_ID:-}"
      AUTONAVLOG_FIREBASE_API_KEY: "${AUTONAVLOG_FIREBASE_API_KEY:-}"
      AUTONAVLOG_FIREBASE_AUTH_DOMAIN: "${AUTONAVLOG_FIREBASE_AUTH_DOMAIN:-}"
      AUTONAVLOG_FIREBASE_APP_ID: "${AUTONAVLOG_FIREBASE_APP_ID:-}"
      AUTONAVLOG_NAVMATE_URL: "${AUTONAVLOG_NAVMATE_URL:-}"
    volumes:
      - autonavlog-data:/var/lib/autonavlog
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "10"
          memory: 20G

volumes:
  autonavlog-data:
